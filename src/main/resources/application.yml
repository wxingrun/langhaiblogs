# 浪海博客系统配置参数
langhai:
  blogs:
    registerDayEmailCount: 20
    registerIPEmailCount: 5
    registerDayUserCount: 5
    secret: 88-888-langhai-8

# 程序端口号
server:
  port: 2086

spring:
  # 数据模板引擎配置
  thymeleaf:
    prefix: classpath:/templates/
    check-template-location: true
    cache: false
    suffix: .html
    encoding: UTF-8
    content-type: text/html
    mode: HTML5

  # 邮件发送配置
  mail:
    # 配置SMTP的服务器地址
    host: smtp.qq.com
    # 发送者的QQ邮箱
    username:
    # 配置秘钥，授权码（不是QQ密码）
    password:
    # 端口号配置
    port: 587
    # 邮件的编码格式
    default-encoding: utf-8
    # 配置SSL加密
    properties:
      mail:
        smtp:
          socketFactoryClass: javax.net.ssl.SSLSocketFactory
        debug: false

  # redis配置
  redis:
    database: 9
    host: ${REDIS_HOST:redis}
    password: ${REDIS_PASSWORD:}
    timeout: 20000
    port: ${REDIS_PORT:6379}

  # mysql数据库配置
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/langhaiblogs?userUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:langhai123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq} # 主机名
    port: ${RABBITMQ_PORT:5672} # 端口
    virtual-host: / # 虚拟主机
    username: ${RABBITMQ_USER:langhai} # 用户名
    password: ${RABBITMQ_PASS:langhai123} # 密码

#  profiles:
#    active: test

# 配置pagehelper的内容
pagehelper:
  helper-dialect: mysql

# minio文件存储配置信息
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}

# 配置es相关信息
es:
  ip: ${ES_HOST:127.0.0.1}
  port: ${ES_PORT:9200}
  userName: ${ES_USER:xxx}
  password: ${ES_PASS:xxx}

logging:
  level:
    root: info

netty:
  # 监听websocket连接的端口
  port: 20202
  # websocket连接地址
  ws: ws://${NETTY_WS_HOST:127.0.0.1}:${netty.port}/ws


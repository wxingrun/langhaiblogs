version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: langhai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: langhai123
      MYSQL_DATABASE: langhaiblogs
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/langhaiblogs.sql:/docker-entrypoint-initdb.d/01-langhaiblogs.sql
      - ./sql/init-roles.sql:/docker-entrypoint-initdb.d/02-init-roles.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-planghai123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6.2
    container_name: langhai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: langhai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: langhai-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: langhai
      RABBITMQ_DEFAULT_PASS: langhai123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langhai-app
    restart: unless-stopped
    ports:
      - "2086:2086"
      - "20202:20202"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  minio-data:
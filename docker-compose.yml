version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: langhaiblogs-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: langhaiblogs
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/langhaiblogs.sql:/docker-entrypoint-initdb.d/langhaiblogs.sql
    networks:
      - langhaiblogs-network

  redis:
    image: redis:6.2
    container_name: langhaiblogs-redis
    restart: always
    command: redis-server --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - langhaiblogs-network

  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: langhaiblogs-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - langhaiblogs-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langhaiblogs-app
    restart: always
    ports:
      - "2086:2086"
    depends_on:
      - mysql
      - redis
      - minio
    networks:
      - langhaiblogs-network

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  langhaiblogs-network:
    driver: bridge
